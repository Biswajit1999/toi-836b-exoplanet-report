name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check scripts tests
      - run: python scripts/analyze_transit.py
      - run: python scripts/analyze_multisector.py
      - run: python scripts/analyze_atmospheric_evidence.py
      - run: python scripts/analyze_spectrum.py
      - run: pytest tests/ -v
